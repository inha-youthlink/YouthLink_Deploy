# (CD) 현재 overlay(이미지 태그·일반 설정)를 EC2의 k3s에 적용. 이미지는 build workflow가 먼저 만들어 둠
name: deploy

# 원하는 시점에 수동 실행 (EC2 self-hosted 러너 필요)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 적용할 앱 (common은 namespace·ingress, 평가는 evaluate workflow로 실행)
        type: choice
        options: [rag, front, etl, common]

# 적용이 겹치지 않게 하나씩 실행
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, k3s]
    env:
      APP: ${{ inputs.app }}
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      # build가 커밋한 최신 태그까지 포함해 이 저장소 받기
      - uses: actions/checkout@v4

      # 아직 한 번도 빌드하지 않은 앱은 적용하지 않음
      - run: |
          if grep -q "newTag: latest" "k8s/$APP/overlays/prod/kustomization.yaml" 2>/dev/null; then
            echo "::error::$APP 이미지가 아직 없습니다. build workflow를 먼저 실행하세요"; exit 1
          fi

      # 그 앱의 overlay만 적용 (바뀐 리소스만 반영됨)
      - run: kubectl apply -k "k8s/$APP/overlays/prod"

      # 상시 서비스는 새 Pod가 준비될 때까지 확인
      - if: inputs.app == 'rag' || inputs.app == 'front'
        run: kubectl -n youthlink rollout status "deploy/youthlink-$APP" --timeout=300s
