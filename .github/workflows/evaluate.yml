# 평가 Job을 원하는 시점에 한 번 실행 (LLM 비용 발생)
name: evaluate

# 원하는 시점에 수동 실행
on:
  workflow_dispatch:
    inputs:
      command:
        description: run(답변 품질·검색 적중률), route(라우팅), baseline(RAG 없이 LLM만)
        type: choice
        options: [run, route, baseline]

# 평가가 겹치면 같은 이름의 Job을 지우게 되므로 하나씩 실행
concurrency:
  group: evaluate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, k3s]
    # Job 실행 제한(activeDeadlineSeconds 2시간)에 여유를 둠
    timeout-minutes: 150
    env:
      COMMAND: ${{ inputs.command }}
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      # 이 저장소 받기 (평가 매니페스트)
      - uses: actions/checkout@v4

      # 평가 이미지가 없거나 ETL이 돌고 있으면 중단 (t3.small 메모리 부족)
      - run: |
          if grep -q "newTag: latest" k8s/ragas-eval/overlays/prod/kustomization.yaml; then
            echo "::error::평가 이미지가 아직 없습니다. build workflow를 app: ragas-eval로 먼저 실행하세요"; exit 1
          fi
          running=$(kubectl -n youthlink get jobs -l app=youthlink-etl -o jsonpath='{.items[?(@.status.active)].metadata.name}')
          if [ -n "$running" ]; then
            echo "::error::ETL이 실행 중입니다 ($running). 끝난 뒤 다시 실행하세요"; exit 1
          fi

      # 입력에 맞게 Job args를 바꾼 임시 overlay 만들기
      # 데이터셋은 이미지에 포함된 golden_vN·routing_vN 중 번호가 가장 큰 파일을 평가 CLI가 고른다
      - run: |
          # --report: 끝나면 성적표를 로그로 내보냄 (아래에서 잘라 첨부 파일로 저장)
          case "$COMMAND" in
            run) args='["run", "--report"]' ;;
            baseline) args='["run", "--baseline", "--report"]' ;;
            route) args='["route", "--report"]' ;;
          esac
          mkdir -p .eval
          cat > .eval/kustomization.yaml <<YAML
          resources:
            - ../k8s/ragas-eval/overlays/prod
          patches:
            - target:
                kind: Job
                name: ragas-eval
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/args
                  value: $args
          YAML

      # 이전 평가 Job을 지우고 새로 적용 (Job은 적용하는 순간 실행됨)
      - run: |
          kubectl -n youthlink delete job ragas-eval --ignore-not-found --wait=true
          kubectl apply -k .eval
          echo "진행 로그: kubectl -n youthlink logs -f job/ragas-eval"

      # Job이 끝날 때까지 대기 (activeDeadlineSeconds를 넘기면 Job이 Failed가 되어 끝난다)
      - run: |
          while :; do
            state=$(kubectl -n youthlink get job ragas-eval -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case " $state " in
              *" Complete "*|*" Failed "*) break ;;
            esac
            sleep 30
          done
          echo "JOB_STATE=$state" >> "$GITHUB_ENV"

      # 로그를 남기고 성적표 구간(REPORT BEGIN ~ END)을 파일로 자름
      - if: always()
        run: |
          mkdir -p reports
          if ! kubectl -n youthlink logs job/ragas-eval > reports/eval.log; then
            echo "::warning::로그를 가져오지 못했습니다 (실행 시간 초과로 Pod가 지워졌을 수 있음)"
          fi
          cat reports/eval.log
          awk '/^===== REPORT BEGIN .+ =====$/ { out = "reports/" $4; next }
               /^===== REPORT END =====$/ { close(out); out = ""; next }
               out != "" { print > out }' reports/eval.log
          ls reports

      # 실행 화면 Artifacts에서 내려받음
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.command }}-${{ github.run_number }}
          path: reports/

      # 평가가 실패했거나 미완료 run이 있으면 workflow도 실패로 표시
      - run: |
          if [ "$JOB_STATE" != "${JOB_STATE#*Complete}" ]; then exit 0; fi
          echo "::error::평가 Job이 완료되지 않았습니다 ($JOB_STATE). 로그와 성적표를 확인하세요"
          exit 1
