# 프론트(Vite SPA) 서빙: SPA 라우팅 폴백, 보안 헤더, 캐시 정책

# 해시가 붙은 빌드 자산만 오래 캐시한다. 나머지(index.html, mockServiceWorker.js 등)는 매번 서버에 확인해
# 배포 직후에도 새 index.html을 받게 한다. 없는 자산은 try_files가 /index.html로 넘기므로 $uri가 바뀌어 no-cache가 된다
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # 응답 Server 헤더와 오류 페이지에 nginx 버전을 드러내지 않는다
    server_tokens off;

    # location에 add_header를 두면 아래 헤더 상속이 끊기므로 헤더는 모두 server 단에 둔다
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri /index.html;
    }
}
