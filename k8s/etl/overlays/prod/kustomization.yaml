# 운영 ETL: 이미지 태그(deploy workflow가 갱신)와 일반 설정
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: youthlink
resources:
  - ../../base
images:
  - name: youthlink/etl
    newName: ECR_REGISTRY/youthlink/etl
    newTag: latest
configMapGenerator:
  - name: etl-config
    envs:
      - config.env
