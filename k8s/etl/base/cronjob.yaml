# 매일 04:00 KST에 정책 파이프라인(적재 → 청크 → 임베딩 → RAG 발행 → 검증)을 실행하는 CronJob. 비밀값은 etl-secrets(클러스터에 수동 생성)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: youthlink-etl
  labels:
    app: youthlink-etl
spec:
  schedule: "0 4 * * *"
  timeZone: "Asia/Seoul"
  # 전날 실행이 안 끝났으면 새로 시작하지 않는다 (중복 실행 방지)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: youthlink-etl
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: youthlink/etl
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              # 단계별 이력을 policy_pipeline_job에 남긴다. 웹 CronJob은 이 이력이 성공이어야 시작한다
              # 최근 실패한 실행이 있으면 실패한 단계부터 이어서 한다
              # 임베딩 배치 크기는 스크립트 기본값(32)이 프록시 제한(요청당 32개)과 같다
              args:
                - >-
                  python etl/run_policy_pipeline.py --resume-latest-failed
              envFrom:
                - configMapRef:
                    name: etl-config
                - secretRef:
                    name: etl-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
