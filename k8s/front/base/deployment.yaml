# 프론트 Deployment. 설정은 빌드 시 이미지에 고정되므로 환경변수가 없다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youthlink-front
  labels:
    app: youthlink-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youthlink-front
  template:
    metadata:
      labels:
        app: youthlink-front
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: front
          image: youthlink/front
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
